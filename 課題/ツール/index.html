<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>画像アップローダー</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <h1>画像アップローダー</h1>

        <!-- 管理者ログイン（ログイン中だけ削除できる） -->
        <div id="auth" class="auth">
          <form id="login-form" class="login-form" hidden>
            <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" required />
            <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" required />
            <button type="submit">ログイン</button>
          </form>
          <button id="show-login" type="button">管理者ログイン</button>
          <div id="logged-in" hidden>
            <span id="user-email" class="user-email"></span>
            <button id="logout" type="button">ログアウト</button>
          </div>
          <p id="auth-error" class="error" hidden></p>
        </div>
      </header>

      <p id="config-error" class="error" hidden>
        .env に VITE_SUPABASE_URL と VITE_SUPABASE_ANON_KEY を設定してください（.env.example を参照）。
      </p>

      <!-- ログインしていないときの案内 -->
      <p id="upload-locked" class="locked">画像をアップロードするには、右上の「管理者ログイン」からログインしてください。</p>

      <!-- ドロップエリア（ログイン中だけ表示。クリックでファイル選択もできる） -->
      <label id="drop" class="drop" hidden>
        <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
        <span>
          ここに画像をドラッグ＆ドロップ<br /><small>またはクリックして選択（JPEG・PNG・WEBP／5MB 未満）</small>
        </span>
      </label>

      <!-- 直前にアップロードした画像の公開URL -->
      <section id="result" class="result" hidden>
        <h2>アップロード完了</h2>
        <ul id="result-list"></ul>
      </section>

      <section>
        <div class="list-header">
          <h2>アップロード済み</h2>
          <button id="reload" type="button">再読み込み</button>
        </div>
        <p id="status" class="status"></p>
        <div id="gallery" class="gallery"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
